<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanguard Control</title>
<style>
:root {
  --bg: #14161b; --panel: #1c1f26; --panel-2: #232731; --line: #2e3340;
  --text: #e6e8ee; --muted: #8b92a3; --accent: #d4a54a; --accent-ink: #1a1408;
  --good: #4caf7a; --bad: #e0605a; --hp: #e0605a; --mp: #4a8fe0; --tp: #d4a54a;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .04em; }
header h1 span { color: var(--accent); }
header .status { color: var(--muted); margin-left: auto; }
.layout { flex: 1; display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: var(--panel-2); }
.card:hover { border-color: #4a5060; }
.card.sel { border-color: var(--accent); background: #2b2618; }
.card.offline { opacity: .55; }
.card.alarm { animation: alarmflash 1s infinite; }
@keyframes alarmflash { 0%, 100% { border-color: var(--bad); box-shadow: 0 0 0 2px rgba(224,96,90,.5); } 50% { border-color: var(--line); box-shadow: none; } }
#alarmbar { display: none; background: rgba(224,96,90,.16); border: 1px solid var(--bad); border-radius: 8px; padding: 6px 10px; margin: 6px 0; align-items: center; gap: 10px; flex-wrap: wrap; }
#alarmbar b { color: var(--bad); }
.card .top { display: flex; align-items: center; gap: 6px; }
.card .nm { font-weight: 600; font-size: 14px; }
.card .jb { color: var(--muted); font-size: 12px; }
.card .pill { margin-left: auto; }
.card .sub { color: var(--muted); font-size: 11px; margin: 2px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars { display: grid; gap: 3px; }
.bar { position: relative; height: 13px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; }
.bar b { position: absolute; left: 5px; top: 0; font-size: 10px; font-weight: 600; line-height: 13px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.pill.on { background: rgba(76,175,122,.18); color: var(--good); }
.pill.off { background: rgba(139,146,163,.15); color: var(--muted); }
.main { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who .nm { font-size: 18px; font-weight: 600; }
.who .jb { color: var(--muted); }
.who .sp { flex: 1; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { padding: 7px 14px; cursor: pointer; color: var(--muted); border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; user-select: none; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); background: var(--panel); border-color: var(--line); margin-bottom: -1px; font-weight: 600; }
.tab .n { color: var(--good); font-size: 11px; margin-left: 4px; }
.body { background: var(--panel); border: 1px solid var(--line); border-top: none; border-radius: 0 0 8px 8px; padding: 12px 14px; }
.box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
.box h3 { margin: 0 0 7px; font-size: 12px; color: var(--accent); font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.stack { display: grid; gap: 12px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; user-select: none; }
.chk input { accent-color: var(--good); width: 15px; height: 15px; cursor: pointer; margin: 0; }
.chk.off span { color: var(--muted); }
.master { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 11px; border-radius: 8px; background: rgba(76,175,122,.07); border: 1px solid rgba(76,175,122,.25); }
.master .chk { font-weight: 600; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0 12px; }
table.grid { border-collapse: collapse; width: 100%; }
table.grid th { font-size: 12px; font-weight: 600; color: var(--muted); padding: 5px 8px; text-align: center; border-bottom: 1px solid var(--line); }
table.grid th:first-child, table.grid td:first-child { text-align: left; }
table.grid td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: center; }
table.grid tr:hover td { background: rgba(255,255,255,.02); }
table.grid input { accent-color: var(--good); width: 16px; height: 16px; cursor: pointer; }
table.grid .me { color: var(--accent); }
.sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 18px; }
.slider label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.slider output { color: var(--text); font-weight: 600; }
.slider input { width: 100%; accent-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select, input[type=text] { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.go { background: var(--good); border-color: var(--good); color: #0c1a12; font-weight: 600; }
button.stop { border-color: var(--bad); color: var(--bad); }
input[type=text] { flex: 1; min-width: 200px; }
label.field { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
label.field select { min-width: 190px; color: var(--text); font-size: 13px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.hint { color: var(--muted); font-size: 11px; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0 10px; }
#log { height: 120px; overflow-y: auto; font: 12px/1.5 Consolas, monospace; background: var(--bg); border-radius: 6px; padding: 6px 8px; border: 1px solid var(--line); }
#log div span { color: var(--muted); margin-right: 8px; }
.empty { color: var(--muted); padding: 10px 2px; }
.steps { color: var(--muted); margin: 6px 0 0; padding-left: 18px; }
.steps b { color: var(--text); }
.btag { display: inline-block; padding: 1px 7px; margin: 2px 3px 0 0; border-radius: 9px; font-size: 11px; background: rgba(139,146,163,.14); color: var(--muted); }
.btag.bad { background: rgba(224,96,90,.18); color: var(--bad); font-weight: 600; cursor: pointer; }
.btag.bad:hover { outline: 1px solid var(--bad); }
.btag.landed { background: rgba(76,175,122,.18); color: var(--good); }
.btag.resisted { background: rgba(224,96,90,.18); color: var(--bad); }
.btag.casting { background: rgba(212,165,74,.2); color: var(--tp); }
.hpbar { height: 6px; border-radius: 3px; background: rgba(139,146,163,.15); overflow: hidden; margin-top: 3px; }
.hpbar div { height: 100%; background: var(--hp); }
.fdash { display: grid; grid-template-columns: 1fr 290px; gap: 12px; align-items: start; }
@media (max-width: 900px) { .fdash { grid-template-columns: 1fr; } }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 1000px) { .fgrid { grid-template-columns: 1fr; } }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.tile b { display: block; font-size: 18px; color: var(--text); }
.tile span { font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: none; border-radius: 0; border-right: 1px solid var(--line); padding: 6px 12px; }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.radar { background: radial-gradient(circle, #1f2430 0%, #171a21 100%); border: 1px solid var(--line); border-radius: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.fstatus { font-size: 15px; font-weight: 600; }
.card .ail { margin-top: 4px; }
.card .ail .btag { font-size: 10px; padding: 0 5px; }
table.board td { vertical-align: top; }
#quickbar { display: none; padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); gap: 6px; flex-wrap: wrap; align-items: center; }
#quickbar.show { display: flex; }
#quickbar button { padding: 4px 10px; }
#quickbar button small { color: var(--muted); margin-left: 4px; }
#addonbar { display: none; padding: 8px 14px; border-bottom: 1px solid var(--line); background: #2b2618; gap: 8px; align-items: center; flex-wrap: wrap; }
#addonbar.show { display: flex; }
#addonbar.ok { background: rgba(76,175,122,.08); }
#addonbar b { color: var(--accent); }
.pill.warn { background: rgba(224,96,90,.18); color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button.on { border-color: var(--good); color: var(--good); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; font-size: 12px; }
.kv span:nth-child(odd) { color: var(--muted); }
.profbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 7px 10px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.profbar b { color: var(--accent); margin-right: 4px; }
.act { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.04); }
.act .chk { flex: 1 1 150px; padding: 0; }
.lim { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.lim input { width: 52px; padding: 2px 4px; font: inherit; font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
.lim input.changed, .lim select.changed { border-color: var(--accent); }
.lim select { padding: 2px 4px; font-size: 11px; }
table.grid input[type=number] { width: 70px; height: auto; }
.strat { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.strat:last-child { border-bottom: none; }
.strat .nm { font-weight: 600; color: var(--accent); }
.strat .ds { color: var(--muted); font-size: 11px; }
table.sgrid { border-collapse: collapse; width: 100%; }
table.sgrid th { font-size: 11px; color: var(--accent); padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel-2); }
table.sgrid th small { display: block; color: var(--muted); font-weight: 400; }
table.sgrid th button { font-size: 10px; padding: 0 5px; margin: 2px 1px 0; }
table.sgrid td { padding: 2px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.04); }
table.sgrid td:first-child { text-align: left; white-space: nowrap; }
table.sgrid tr.grp td { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding-top: 8px; text-align: left; }
table.sgrid tr:hover td { background: rgba(255,255,255,.03); }
table.sgrid input { accent-color: var(--good); width: 16px; height: 16px; cursor: pointer; }
table.sgrid .na { color: var(--line); }
.strat details { margin-top: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.strat summary { cursor: pointer; padding: 5px 8px; user-select: none; }
.strat summary b { color: var(--text); font-weight: 600; }
.strat details .pick { padding: 4px 10px 8px; }
.strat details h4 { margin: 6px 0 2px; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.strat details .checks { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.charges { display: flex; gap: 4px; align-items: center; }
.charges i { width: 16px; height: 16px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); }
.charges i.on { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1><span>VANGUARD</span> CONTROL</h1>
  <button class="primary" onclick="setupParty()" title="The selected character leads; everyone else follows and uses their job's setup">Set up party</button>
  <button class="go" onclick="post('*','on')">Start all</button>
  <button class="stop" onclick="post('*','off')">Stop all</button>
  <label class="chk" id="autostartbox" title="On: characters start by themselves when they log in or Vanguard reloads. Off: they wait for Start.">
    <input type="checkbox" id="autostart"><span>Auto start</span></label>
  <span id="timerbadge" class="pill on" style="display:none;cursor:pointer" title="Stop timer (Team tab)" onclick="setTab('team')"></span>
  <span id="crashbadge" class="pill warn" style="display:none;cursor:pointer" title="Problems were caught - click to send a report" onclick="setTab('app')"></span>
  <div class="status" id="status">Waiting for characters…</div>
  <button onclick="quitApp()" title="Close Vanguard Control">Quit</button>
</header>
<div id="addonbar"></div>
<div id="alarmbar"></div>
<div id="quickbar"></div>
<div class="layout">
  <aside id="chars">
    <div class="empty">No characters yet.
      <ol class="steps">
        <li>Follow the bar above if it asks for anything (the app installs Vanguard for you).</li>
        <li>Log in your characters with Windower.</li>
        <li>Click the one you play, then <b>Set up party</b>.</li>
        <li>Tick what each one should do, then <b>Start all</b>.</li>
      </ol>
    </div>
  </aside>
  <div class="main">
    <div id="panel"></div>
    <div><div class="hint" style="margin-bottom:4px">Activity</div><div id="log"></div></div>
  </div>
</div>

<script>
const MODULES = ["follow","assist","heal","raise","cleanse","buffs","mana","rest","actions","ws","sc","burst","songs","geo","debuff","dispel","triggers","trusts","farm"];
const GROUPS = ["Buffs","Offense","Defense","Healing","Support","Debuffs","Pet","Recovery"];
let chars = {}, selected = null, since = 0, tab = "team", bodyKey = "", headKey = "", listKey = "", addon = {}, addonKey = "";
try { tab = localStorage.getItem("vg.tab") || "team"; } catch (e) {}

const $ = id => document.getElementById(id);
const arr = x => Array.isArray(x) ? x : [];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lc = s => String(s ?? "").toLowerCase();
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const bar = (v, c, max = 100, label) => { const n = Number(v) || 0; return `<div class="bar"><i style="width:${Math.min(100, n * 100 / max)}%;background:${c}"></i><b>${label ? label + " " : ""}${n}</b></div>`; };

function post(target, command) {
  fetch("/api/send", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({target, command})})
    .then(() => setTimeout(() => fetch("/api/send", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({target, command: "profile"})}), 350));
}
function send(cmd) {
  if (cmd.startsWith("__all ")) return post("*", cmd.slice(6));
  if (cmd.startsWith("__lead ")) { const c = cmd.slice(7); if (c.trim() === "rolls" || c.trim() === "rolls ") return; return lead(c); }
  if (cmd.startsWith("__app ")) { const [, k, v] = cmd.split(" "); return addonDo(k, "&on=" + v); }
  if (cmd.trim() === "rolls") return;      // "— pick a set —"
  if (selected) post(selected, cmd);
}
function setupParty() {
  if (!selected) { alert("Click the character you play first. It becomes the leader."); return; }
  fetch("/api/setup?leader=" + encodeURIComponent(selected));
}
function selectChar(name) { selected = name; bodyKey = headKey = listKey = ""; render(); if (tab === "farm") radarPoll(); }
function setTab(t) { tab = t; try { localStorage.setItem("vg.tab", t); } catch (e) {} bodyKey = headKey = ""; render(); if (t === "farm") radarPoll(); }
async function quitApp() { await fetch("/api/quit"); window.close(); }

// ---------- small builders ----------
// Checkbox that sends one command when ticked and another when unticked.
const chk = (label, checked, on, off, title = "") =>
  `<label class="chk ${checked ? "" : "off"}" title="${esc(title)}"><input type="checkbox" ${checked ? "checked" : ""}
    data-on="${esc(on)}" data-off="${esc(off)}"><span>${esc(label)}</span></label>`;
const modChk = (label, mods, m, title) => chk(label, !!mods[m], m + " on", m + " off", title);
const opt = (v, l, cur) => `<option value="${esc(v)}" ${lc(v) === lc(cur) ? "selected" : ""}>${esc(l)}</option>`;
const sel = (cmd, options, cur, empty = "") =>
  `<select data-cmd="${esc(cmd)}" data-empty="${esc(empty)}">${options.map(o => opt(o.v, o.l, cur)).join("")}</select>`;
const slider = (label, setting, val, min, max, step = 1, unit = "%") =>
  `<div class="slider"><label>${esc(label)} <output>${val}${unit}</output></label>
   <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-cmd="set ${setting} " data-unit="${unit}"></div>`;

// ---------- tabs ----------
function tabsFor(p) {
  const m = p.menu || {}, cfg = p.config || {};
  const t = [{id: "team", label: "Team"}, {id: "job", label: "Job & abilities"}];
  if (m.can_cure || m.can_raise || arr(m.cleanse).length) t.push({id: "heal", label: "Healing & MP"});
  else t.push({id: "heal", label: "Recovery"});
  if (arr(m.party_buffs).length || arr(m.self_buffs).length) t.push({id: "buffs", label: "Buffs", n: arr(cfg.buffs).length});
  if (arr(m.debuffs).length || m.can_dispel) t.push({id: "debuffs", label: "Enfeebles", n: arr(cfg.debuffs).length});
  if (arr(m.songs).length) t.push({id: "songs", label: "Songs", n: arr(cfg.songs).length});
  if (arr(m.indi).length || arr(m.geo).length) t.push({id: "geo", label: "Geomancy"});
  if ((cfg.strat_info || {}).max > 0) t.push({id: "strat", label: "Stratagems"});
  t.push({id: "farm", label: "Farming", n: ((chars[selected] || {}).snapshot || {}).modules?.farm ? "on" : 0});
  t.push({id: "adv", label: "Advanced"});
  t.push({id: "app", label: "App & updates"});
  t.push({id: "news", label: "What's new", n: newsUnseen() ? "new" : 0});
  return t;
}

function jobTab(c, p) {
  const s = c.snapshot || {};
  const others = Object.keys(chars).filter(n => n !== selected).sort();
  const acts = arr(p.actions), by = {};
  acts.forEach(a => (by[a.group] = by[a.group] || []).push(a));
  return `<div class="stack">
    <div class="row" style="align-items:flex-end">
      <label class="field">Role ${sel("role ", arr(p.roles).map(r => ({v: r.id, l: r.label})), p.role)}</label>
      <label class="field">Weapon skill ${sel("ws ", [{v: "", l: "None"}].concat(arr(p.ws_list).map(w => ({v: w, l: w}))), p.ws)}</label>
      <label class="field">Follow / assist ${sel("leader ", [{v: "", l: "Nobody (I lead)"}].concat(others.map(n => ({v: n, l: n}))), s.leader || "", "none")}</label>
    </div>
    ${finishBox(p)}
    ${acts.length ? `<div class="box"><h3>Abilities, in priority order: the top one is tried first <button style="float:right;font-size:11px" onclick="send('actmove reset')">Reset order</button></h3>
      ${acts.map((a, i) => `<div class="act"><span class="hint" style="width:20px;text-align:right">${i + 1}</span>
        <span style="display:inline-flex;gap:2px"><button title="Move up" ${i ? "" : "disabled"} onclick="send('actmove ${esc(a.id)} up')">▲</button><button title="Move down" ${i < acts.length - 1 ? "" : "disabled"} onclick="send('actmove ${esc(a.id)} down')">▼</button><button title="Move to the top" ${i ? "" : "disabled"} onclick="send('actmove ${esc(a.id)} top')">⤒</button></span>
        ${chk(a.label, a.on, `action ${a.id} on`, `action ${a.id} off`)}<span class="btag">${esc(a.group)}</span>${limits(a)}</div>`).join("")}</div>`
      : `<div class="empty">Waiting for ${esc(selected)}'s job info…</div>`}
    ${jobExtras(p)}
    <div class="hint">Only abilities ${esc(selected)} can use right now are listed (sub-job included). Changing the role re-ticks the recommended set.</div>
  </div>`;
}

// Each ability's thresholds: edit them like CurePlease; the job's recommended value is in the tooltip.
const LIMIT_LABEL = {party_below: "party HP <", hpp_below: "my HP <", mpp_below: "MP <", mpp_above: "MP >",
  tp_min: "TP \u2265", tp_max: "TP <", cooldown: "every", when: ""};
const WHEN_OPTS = [["always", "always"], ["combat", "party fighting"], ["engaged", "I'm fighting"], ["idle", "out of combat"]];
function limits(a) {
  return arr(a.limits).map(l => {
    const changed = l.v !== l.d ? "changed" : "";
    if (l.k === "when") return `<span class="lim"><select class="${changed}" data-cmd="actopt ${esc(a.id)} when " title="Recommended: ${esc(l.d)}">${
      WHEN_OPTS.map(([v, t]) => opt(v, t, l.v)).join("")}</select></span>`;
    const unit = l.k === "cooldown" ? "s" : (l.k.startsWith("tp") ? "" : "%");

// The spell that removes each ailment (Erase for the rest that Erase can take off).
const CURE_FOR = {poison: "Poisona", paralysis: "Paralyna", blindness: "Blindna", silence: "Silena", petrification: "Stona",
  disease: "Viruna", plague: "Viruna", curse: "Cursna", doom: "Cursna", sleep: "Cure", lullaby: "Cure"};
const NO_CURE = new Set(["stun", "terror", "charm", "amnesia", "mute", "impairment", "encumbrance"]);
function cureSpellFor(ail) { const a = lc(ail); return CURE_FOR[a] || (NO_CURE.has(a) ? "" : "Erase"); }
function curerFor(spell, target) {
  // someone online who can cast it right now; the target itself last (Erase can't be cast on yourself)
  const can = n => chars[n].online && arr((((chars[n].profile || {}).config || {}).known || {}).spells).includes(spell);
  const names = Object.keys(chars).filter(can).sort((a, b) => (a === target) - (b === target));
  return names.find(n => !(n === target && spell === "Erase")) || "";
}
function cureAilment(target, ail) {
  const spell = cureSpellFor(ail), who = spell ? curerFor(spell, target) : "";
  if (!who) { alert(spell ? `Nobody here can cast ${spell} right now.` : `${ail} can't be removed with a spell.`); return; }
  post(who, `act ma ${who === target ? "me" : target} ${spell}`);

// ---------- Enemy watch: what the team is fighting, which enfeebles stuck, its last TP move ----------
// Every character reports its battle target (snapshot.foe); the same mob seen by several is merged (best state wins).
function foes() {
  const rank = {landed: 3, casting: 2, resisted: 1, wanted: 0}, by = {};
  for (const n of Object.keys(chars).sort()) {
    const f = chars[n].online && (chars[n].snapshot || {}).foe;
    if (!f || !f.id) continue;
    const m = by[f.id] || (by[f.id] = {id: f.id, name: f.name, hpp: f.hpp, d: f.d, who: [], eff: {}, order: [], move: null});
    m.who.push(n); m.hpp = Math.min(m.hpp, f.hpp); m.d = Math.min(m.d, f.d);
    for (const e of arr(f.effects)) {
      if (!(e.n in m.eff)) m.order.push(e.n);
      if (!(e.n in m.eff) || rank[e.s] > rank[m.eff[e.n]]) m.eff[e.n] = e.s;
    }
    if (f.move && !m.move) m.move = f.move;
  }
  return Object.values(by);
}
function foeBox() {
  const list = foes();
  if (!list.length) return "";

// ---------- Skillchain builder: pick who uses which weapon skill, see what it makes ----------
// opener property -> closer property -> skillchain (the standard FFXI table)
const SC_TABLE = {
  Transfixion: {Compression: "Compression", Scission: "Distortion", Reverberation: "Reverberation"},
  Compression: {Transfixion: "Transfixion", Detonation: "Detonation"},
  Liquefaction: {Scission: "Scission", Impaction: "Fusion"},
  Scission: {Liquefaction: "Liquefaction", Reverberation: "Reverberation", Detonation: "Detonation"},
  Reverberation: {Induration: "Induration", Impaction: "Impaction"},
  Detonation: {Compression: "Gravitation", Scission: "Scission"},
  Induration: {Compression: "Compression", Reverberation: "Fragmentation", Impaction: "Impaction"},
  Impaction: {Liquefaction: "Liquefaction", Detonation: "Detonation"},
  Gravitation: {Distortion: "Darkness", Fragmentation: "Fragmentation"},
  Distortion: {Gravitation: "Darkness", Fusion: "Fusion"},
  Fusion: {Gravitation: "Gravitation", Fragmentation: "Light"},
  Fragmentation: {Distortion: "Distortion", Fusion: "Light"},
  Light: {Light: "Light"}, Darkness: {Darkness: "Darkness"},
};
const SC_BURST = {Light: "Fire, Wind, Thunder, Light", Darkness: "Earth, Water, Ice, Dark", Gravitation: "Earth, Dark",
  Fragmentation: "Wind, Thunder", Distortion: "Water, Ice", Fusion: "Fire, Light", Compression: "Dark", Liquefaction: "Fire",
  Induration: "Ice", Reverberation: "Water", Transfixion: "Light", Scission: "Earth", Detonation: "Wind", Impaction: "Thunder"};
// What a closer makes on an opener (each a list of properties); the closer's properties are tried in order.
function scCombine(opener, closer) {
  for (const c of closer) for (const o of opener) { const r = (SC_TABLE[o] || {})[c]; if (r) return r; }
  return "";
}
// The results along a chain of weapon-skill property lists: [null, result after step 2, after step 3, ...]
function scResults(propLists) {
  const out = [null]; let cur = propLists[0] || [];
  for (let i = 1; i < propLists.length; i++) {
    const r = scCombine(cur, propLists[i] || []);
    out.push(r);
    cur = r ? [r] : (propLists[i] || []);   // a broken chain starts again from this weapon skill
  }
  return out;
}

// ---------- Upkeep: food, Reraise and mount per character, from what each one really has ----------
// ---------- Cooldowns: every character's job abilities, time until ready, click a ready one to use it ----------
// Drawn into its own box every poll (not part of the Team tab redraw), so menus stay open while the timers tick.
let cdOnlyLong = true;
let cdMax = {};        // the longest wait seen per "Name|Ability" - tells which abilities have long recasts (kept in this browser)
try { cdMax = JSON.parse(localStorage.getItem("vg_cdmax") || "{}") || {}; } catch (e) {}
let cdLast = "", cdSaved = "";
function fmtLeft(s) { s = Math.max(0, Math.round(s)); return s >= 3600 ? `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}h` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function renderCooldowns() {
  const box = $("cdbox"); if (!box) return;
  const names = Object.keys(chars).sort().filter(n => chars[n].online && arr((chars[n].snapshot || {}).cd).length);
  box.style.display = names.length ? "" : "none";
  if (!names.length) return;
  if (document.activeElement && box.contains(document.activeElement) && document.activeElement.tagName === "SELECT") return;
  const rows = names.map(n => {
    let list = arr(chars[n].snapshot.cd);
    for (const c of list) { const k = n + "|" + c.n; cdMax[k] = Math.max(cdMax[k] || 0, c.s); }
    if (cdOnlyLong) list = list.filter(c => c.sp || (cdMax[n + "|" + c.n] || 0) >= 60);
    const chips = list.map(c => c.s > 0
      ? `<span class="btag" title="${esc(c.n)}: ready in ${fmtLeft(c.s)}">${esc(c.n)} ${fmtLeft(c.s)}</span>`
      : `<span class="btag landed" style="cursor:pointer" title="Click: ${esc(n)} uses ${esc(c.n)}${c.t === "bt" ? " on its target" : ""}" onclick="post('${esc(n)}', 'act ja ${c.t} ${esc(c.n)}')">${esc(c.n)}</span>`).join("");
    return `<tr><td><b>${esc(n)}</b></td><td style="text-align:left">${chips || `<span class="hint">${cdOnlyLong ? "no long cooldowns used yet" : "none"}</span>`}</td></tr>`;
  }).join("");
  const html = `<h3>Cooldowns</h3>
    <table class="grid board"><thead><tr><th>Character</th><th style="text-align:left">Job abilities (green = ready: click to use it, grey = time left)</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="row" style="margin-top:6px"><label class="chk"><input type="checkbox" ${cdOnlyLong ? "checked" : ""} onchange="cdOnlyLong=this.checked;renderCooldowns()"> Only the long ones (1-hour abilities, and any that waited a minute or more once used)</label></div>`;
  if (html !== cdLast || !box.innerHTML) { cdLast = html; box.innerHTML = html; }
  const saved = JSON.stringify(cdMax);
  if (saved !== cdSaved) { cdSaved = saved; try { localStorage.setItem("vg_cdmax", saved); } catch (e) {} }

const fmtN = n => n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "k" : String(Math.round(n));

  let html = "", cls = "show";

// ---------- Reactions: "when ... do ... how often", built from menus (a skill editor like the paid suites') ----------
let rx = {when: "hpp", val: "40", who: "", fight: true, kind: "ma", name: "", target: "me", cd: "30"};
const RX_WHEN = [["hpp", "my HP is below"], ["mpp", "my MP is below"], ["tp", "my TP is at least"], ["party_hpp", "anyone's HP is below"],
  ["member", "this member's HP is below"], ["mob_hpp", "the enemy's HP is below"], ["readies", "the enemy readies"], ["casts", "the enemy casts"],
  ["nobuff", "I don't have"], ["buff", "I have"], ["engaged", "I'm fighting"], ["idle", "I'm not fighting"]];
const COMMON_BUFFS = ["Haste", "Refresh", "Regen", "Protect", "Shell", "Phalanx", "Stoneskin", "Blink", "Aquaveil", "Reraise", "Food", "Sneak", "Invisible"];
function rxCondition() {
  const v = rx.val;
  switch (rx.when) {
    case "hpp": case "mpp": case "party_hpp": case "mob_hpp": return `${rx.when}<${v}`;
    case "tp": return `tp>=${v}`;
    case "member": return rx.who ? `hpp:${rx.who}<${v}` : "";
    case "readies": case "casts": return v ? `${rx.when}:${v}` : "";
    case "nobuff": return v ? `!buff:${v}` : "";
    case "buff": return v ? `buff:${v}` : "";
    default: return rx.when;
  }
}
function rxDescribe(rule) {
  const m = String(rule).match(/^(.*?)\s*->\s*(.*?)(?:\s*\|\s*(\w+))?$/); if (!m) return rule;
  const conds = m[1].split(/\s+and\s+/).map(c => {
    let x;
    if ((x = c.match(/^(hpp|mpp|party_hpp|mob_hpp)<(\d+)$/))) return ({hpp: "my HP", mpp: "my MP", party_hpp: "anyone's HP", mob_hpp: "the enemy's HP"})[x[1]] + ` below ${x[2]}%`;
    if ((x = c.match(/^tp>=(\d+)$/))) return `my TP at least ${x[1]}`;
    if ((x = c.match(/^hpp:(\w+)<(\d+)$/))) return `${x[1]}'s HP below ${x[2]}%`;
    if ((x = c.match(/^(readies|casts):(.+)$/))) return `the enemy ${x[1]} ${x[2]}`;
    if ((x = c.match(/^(!?)buff:(.+)$/))) return x[1] ? `I don't have ${x[2]}` : `I have ${x[2]}`;
    return ({engaged: "I'm fighting", idle: "I'm not fighting", resting: "I'm resting"})[c] || c;
  }).join(" and ");
  let act = m[2]; const a = act.match(/^vg act (\w+) (\S+) ?(.*)$/);
  if (a) act = `${({ma: "cast", ja: "use", ws: "weapon skill", item: "use item"})[a[1]] || a[1]} ${a[3]} on ${TARGET_LABEL[a[2]] || a[2]}`;
  const cd = m[3] === "once" ? "once per mob" : `at most every ${m[3] || 10} s`;
  return `When ${conds}: ${act} (${cd})`;
}
function reactBox(p) {
  const x = (p.config || {}).extra || {}, seen = x.seen || {}, list = arr(x.triggers);
  const known = quickKnown(selected), names = known[rx.kind] || [];
  if (!names.includes(rx.name)) rx.name = names[0] || "";
  const party = arr(p.party).slice(1);
  const o = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur) ? "selected" : ""}>${esc(l)}</option>`;
  let valSel = "";
  if (["hpp", "mpp", "party_hpp", "member", "mob_hpp"].includes(rx.when)) {
    if (!/^\d+$/.test(rx.val) || +rx.val > 95) rx.val = "40";
    valSel = `<select id="rxval">${[10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 75, 80, 90, 95].map(n => o(n, n + "%", rx.val)).join("")}</select>`;
  } else if (rx.when === "tp") {
    if (!["1000", "1500", "2000", "2500", "3000"].includes(rx.val)) rx.val = "1000";
    valSel = `<select id="rxval">${[1000, 1500, 2000, 2500, 3000].map(n => o(n, n, rx.val)).join("")}</select>`;
  } else if (rx.when === "readies" || rx.when === "casts") {
    const seenList = arr(seen[rx.when]).slice().reverse();
    if (!seenList.includes(rx.val)) rx.val = seenList[0] || "";
    valSel = seenList.length ? `<select id="rxval">${seenList.map(n => o(n, n, rx.val)).join("")}</select>`
      : `<span class="hint">none seen yet - fight a while, they appear here</span>`;
  } else if (rx.when === "buff" || rx.when === "nobuff") {
    const mine = arr((chars[selected].snapshot || {}).buffs).filter(b => !b.b).map(b => b.n);
    const opts = [...new Set(COMMON_BUFFS.concat(mine))];
    if (!opts.includes(rx.val)) rx.val = opts[0];
    valSel = `<select id="rxval">${opts.map(n => o(n, n, rx.val)).join("")}</select>`;
  }
  const targets = [["me", "itself"], ["bt", "the enemy"], ["leader", "the leader"]].concat(party.map(n => [n, n]));
  const cond = rxCondition(), ok = cond && rx.name;
  return `<div class="box"><h3>Reactions: when something happens, do something</h3>
    <div class="row" style="align-items:flex-end">
      <label class="field">When <select id="rxwhen">${RX_WHEN.map(([v, l]) => o(v, l, rx.when)).join("")}</select></label>
      ${rx.when === "member" ? `<label class="field">Who <select id="rxwho">${party.map(n => o(n, n, rx.who || (rx.who = party[0] || ""))).join("")}</select></label>` : ""}
      ${valSel ? `<label class="field">&nbsp;${valSel}</label>` : ""}
      ${!["engaged", "idle"].includes(rx.when) ? `<label class="chk" style="margin-bottom:6px"><input type="checkbox" id="rxfight" ${rx.fight ? "checked" : ""}><span>only while fighting</span></label>` : ""}
    </div>
    <div class="row" style="align-items:flex-end;margin-top:6px">
      <label class="field">Do <select id="rxkind">${["ma", "ja", "ws", "item"].map(k => o(k, KIND_LABEL[k], rx.kind)).join("")}</select></label>
      <label class="field">Which <select id="rxname">${names.length ? names.map(n => o(n, n, rx.name)).join("") : `<option value="">— nothing known —</option>`}</select></label>
      <label class="field">On <select id="rxtarget">${targets.map(([v, l]) => o(v, l, rx.target)).join("")}</select></label>
      <label class="field">How often <select id="rxcd">${[["once", "once per mob"], ["5", "every 5 s at most"], ["10", "every 10 s"], ["30", "every 30 s"], ["60", "every minute"], ["120", "every 2 minutes"], ["300", "every 5 minutes"]].map(([v, l]) => o(v, l, rx.cd)).join("")}</select></label>
      <button class="primary" ${ok ? "" : "disabled"} onclick="rxAdd()">Add reaction</button>
    </div>
    ${list.length ? `<div style="margin-top:8px">${list.map(t => `<div class="act"><span>${esc(rxDescribe(t.rule))}</span>
      <button title="Remove" onclick="send('trigger del ${esc(t.k)}')">×</button></div>`).join("")}</div>`
      : `<div class="hint" style="margin-top:6px">No reactions yet. E.g. "When my HP is below 40%: Cure IV on itself", "When the enemy readies (a TP move): Stoneskin on itself".</div>`}
    <div class="hint" style="margin-top:4px">Adding one switches the Triggers module on.</div>
  </div>`;
}
function rxAdd() {
  const cond = rxCondition(); if (!cond || !rx.name) return;
  const full = cond + (rx.fight && !["engaged", "idle"].includes(rx.when) ? " and engaged" : "");
  send(`trigger add ${full} -> vg act ${rx.kind} ${rx.target} ${rx.name} | ${rx.cd}`);
  send("triggers on");
}

function trustRole(name) {
  const base = String(name).replace(/\s*\[S\]$/, "").replace(/\s*\(UC\)$/, "").replace(/\s+II$/, "").trim();
  for (const [role, names] of Object.entries(TRUST_ROLES)) if (names.includes(base)) return role;

function trustSelect(avail) {

}

// The farming engine is vg_farm.lua: camp + leash, back to camp, a give-up list for mobs it can't reach, waiting for
// the party (and telling the low one to rest), aggro-only / anything-nearby modes, stop conditions, run stats, spots.
const CHECK_LABEL = {weak: "Too Weak", easy: "Easy Prey", decent: "Decent Challenge", even: "Even Match", tough: "Tough", vtough: "Very Tough", itough: "Incredibly Tough", nm: "NM (impossible to gauge)", unknown: "?"};
const CHECK_COL = {weak: "var(--muted)", easy: "var(--muted)", decent: "var(--good)", even: "var(--good)", tough: "var(--tp)", vtough: "var(--tp)", itough: "var(--bad)", nm: "var(--bad)", unknown: "var(--muted)"};
const RADAR_COL = {strong: "#9b59b6", target: "#4caf7a", aggro: "#e0605a", theirs: "#d4a54a", skipped: "#6b7280", ignored: "#4b5160", no: "#8b92a3", pack: "#a07ad8"};
let radarZoom = 0;            // 0 = fit what's around; else yalms from the centre to the edge
try { radarZoom = +localStorage.getItem("vg.radarzoom") || 0; } catch (e) {}
function setRadarZoom(z) { radarZoom = z; try { localStorage.setItem("vg.radarzoom", z); } catch (e) {} bodyKey = ""; render(); }
function radarSvg(rd, farmer) {
  const W = 270, R = W / 2, me = rd.me, ctr = rd.camp || me;
  const reach = Math.max(25, rd.range + 12, ...arr(rd.mobs).concat(arr(rd.party), [me]).map(m => Math.hypot(m.x - ctr.x, m.y - ctr.y) + 4));
  const k = (R - 12) / (radarZoom || Math.min(reach, 70));
  const X = v => (R + (v - ctr.x) * k).toFixed(1), Y = v => (R - (v - ctr.y) * k).toFixed(1);
  const inside = m => Math.hypot(m.x - ctr.x, m.y - ctr.y) * k < R - 4;
  let g = "";
  for (let i = 1; i <= 3; i++) g += `<circle cx="${R}" cy="${R}" r="${(R - 12) * i / 3}" fill="none" stroke="#2e3340" stroke-width="1"/>`;
  g += `<line x1="${R}" y1="8" x2="${R}" y2="${W - 8}" stroke="#262b36"/><line x1="8" y1="${R}" x2="${W - 8}" y2="${R}" stroke="#262b36"/>`;
  g += `<text x="${R}" y="9" fill="#5b6273" font-size="9" text-anchor="middle">N</text>`;
  if (rd.camp) g += `<circle cx="${X(rd.camp.x)}" cy="${Y(rd.camp.y)}" r="${(rd.range * k).toFixed(1)}" fill="rgba(212,165,74,.07)" stroke="#d4a54a" stroke-dasharray="4 3"/>
    <text x="${X(rd.camp.x)}" y="${(+Y(rd.camp.y) + 3).toFixed(1)}" font-size="10" text-anchor="middle" fill="#d4a54a">⛺</text>`;
  if (arr(rd.route).length > 1) g += `<polyline points="${rd.route.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="none" stroke="#4a8fe0" stroke-width="1.5" stroke-dasharray="3 3" opacity=".8"/>`;
  for (const m of arr(rd.mobs)) {
    if (!inside(m)) continue;
    const c = RADAR_COL[m.s] || RADAR_COL.no, big = m.s === "target" || m.s === "aggro";
    g += `<circle class="rdot" data-mob="${esc(m.n)}" cx="${X(m.x)}" cy="${Y(m.y)}" r="${big ? 5 : 4}" fill="${c}" opacity="${big ? 1 : .6}" style="cursor:pointer"><title>${esc(m.n)} (${esc(m.s)}${m.p ? `, ${m.p} other${m.p > 1 ? "s" : ""} next to it` : ""}) - click to choose</title></circle>`;
    if (m.t) g += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="8" fill="none" stroke="#fff" stroke-width="1.5"/><line x1="${X(me.x)}" y1="${Y(me.y)}" x2="${X(m.x)}" y2="${Y(m.y)}" stroke="#fff" stroke-opacity=".35"/>`;
  }
  for (const pm of arr(rd.party)) if (inside(pm)) g += `<circle cx="${X(pm.x)}" cy="${Y(pm.y)}" r="4" fill="#4a8fe0" stroke="#14161b"/><text x="${X(pm.x)}" y="${(+Y(pm.y) + 14).toFixed(1)}" font-size="9" fill="#8fb6ec" text-anchor="middle">${esc(pm.n)}</text>`;
  g += `<circle cx="${X(me.x)}" cy="${Y(me.y)}" r="5.5" fill="#e6e8ee" stroke="#14161b" stroke-width="1.5"/><text x="${X(me.x)}" y="${(+Y(me.y) - 9).toFixed(1)}" font-size="10" fill="#e6e8ee" font-weight="600" text-anchor="middle">${esc(farmer)}</text>`;
  return `<svg class="radar" width="${W}" height="${W}" viewBox="0 0 ${W} ${W}">${g}</svg>
    <div class="legend"><span><i style="background:${RADAR_COL.target}"></i>to fight</span><span><i style="background:${RADAR_COL.aggro}"></i>attacking us</span>
      <span><i style="background:${RADAR_COL.theirs}"></i>someone else's</span><span><i style="background:${RADAR_COL.skipped}"></i>skipped (can't reach)</span><span><i style="background:${RADAR_COL.strong}"></i>too strong</span><span><i style="background:${RADAR_COL.pack}"></i>in a pack (left for now)</span>
      <span><i style="background:${RADAR_COL.no};opacity:.55"></i>left alone</span><span><i style="background:#4a8fe0"></i>party</span></div>
    <div class="hint" style="margin-top:2px">Click a mob to fight that kind or leave it alone.</div>`;
}
let farmRuns = [];
async function farmRunsDo(q) { try { farmRuns = await (await fetch("/api/farmruns?" + (q || ""))).json(); } catch (e) {} bodyKey = ""; render(); }
let radarTimer = null;
// click a mob on the radar: fight that kind / leave it alone
document.addEventListener("click", e => {
  const dot = e.target.closest && e.target.closest(".rdot");
  let menu = $("radarmenu");
  if (!dot) { if (menu && !e.target.closest("#radarmenu")) menu.remove(); return; }
  if (!menu) { menu = document.createElement("div"); menu.id = "radarmenu"; document.body.appendChild(menu); }
  const n = dot.dataset.mob;
  menu.style.cssText = `position:fixed;left:${e.clientX + 8}px;top:${e.clientY + 8}px;z-index:50;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.4)`;
  menu.innerHTML = `<div style="font-weight:600;margin-bottom:6px">${esc(n)}</div>
    <button class="primary" id="rm-fight">Fight these</button> <button id="rm-leave">Leave alone</button>`;
  $("rm-fight").onclick = () => { send("farmlist add targets " + n); menu.remove(); };
  $("rm-leave").onclick = () => { send("farmlist add ignore " + n); menu.remove(); };
});
function radarPoll() {          // the Farming tab is open: ask the selected character for its radar every few seconds
  clearInterval(radarTimer);
  farmRunsDo("");
  const ask = () => fetch("/api/send", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({target: selected, command: "radar"})});
  radarTimer = setInterval(() => { if (tab === "farm" && selected) ask(); else clearInterval(radarTimer); }, 4000);
  if (selected) ask();
}
// copy a saved farm spot to another character (spots are kept per character)
function copySpot(key, who) {
  if (!who) return;
  const sp = arr((((chars[selected] || {}).profile || {}).config || {}).extra?.farm_spots).find(q => q.k === key);
  if (sp && sp.raw) post(who, "farmspot import " + sp.raw);
}
function bringTeam(farmer) {    // everyone else follows and helps the farmer
  for (const n of Object.keys(chars)) {
    if (!chars[n].online) continue;
    if (n === farmer) post(n, "leader none");
    else { post(n, "leader " + farmer); post(n, "follow on"); post(n, "assist on"); post(n, "on"); }
  }
}
let farmView = "simple";
try { farmView = localStorage.getItem("vg.farmview") || "simple"; } catch (e) {}
function setFarmView(v) { farmView = v; try { localStorage.setItem("vg.farmview", v); } catch (e) {} bodyKey = ""; render(); }
// ---------- Magian trials (his request): track trials, "Help finish it" sets farming up for one ----------
let trialForm = {kind: "kill", goal: 100, ws: "", mobs: ""};
function trialAdd() { const f = trialForm; send(`trial add ${f.kind}|${f.goal}|${f.kind === "ws" ? f.ws : ""}|${f.mobs}`); }
// what Auto learned for the trial's mob (the finish box's list), as a number, or null
function learnedAt(x, mobs) {
  const l = arr(x.ws_finish_learned).find(e => mobs && lc(e.n).includes(lc(mobs)));
  return l ? l.at : null;
}

// why the weapon skill missed the kill this session, and which way to move the %
function trialMisses(t) {
  const w = t.why || {}, n = k => +(w[k] || 0);
  const total = n("no_tp") + n("jumped") + n("ws_no_kill") + n("other");
  if (!total) return "";
  const parts = [[n("jumped"), "died in one go from above the %"], [n("no_tp"), "TP wasn't ready"], [n("ws_no_kill"), esc(t.ws) + " went off but didn't kill"], [n("other"), "other"]]
    .filter(p => p[0] > 0).map(p => `${p[0]} ${p[1]}`);
  const tip = n("jumped") > Math.max(n("ws_no_kill"), 1) ? "Try a higher %." : n("ws_no_kill") > Math.max(n("jumped"), 1) ? "Try a lower %." :
    n("no_tp") > total / 2 ? "TP isn't ready in time: a higher % makes it hold off for TP sooner." : "";
  return `<div class="hint" style="margin-top:2px">Missed: ${parts.join(", ")}. ${tip}</div>`;
}

// how long the trial has left at this pace (DreamBot-style "time to level"): kills an hour x how often a kill counts
function trialEta(t, run) {
  const left = Math.max(0, (t.goal || 0) - (t.count || 0));
  const kph = +(run && run.kph) || 0;
  if (!left || !kph || t.done) return "";
  const rate = t.kind === "ws" ? (t.tries >= 5 ? (t.hits || 0) / t.tries : null) : 1;
  if (rate === null) return `<div class="hint" style="margin-top:2px">${left} to go - a time estimate shows after a few kills</div>`;
  if (rate <= 0) return `<div class="hint" style="margin-top:2px">${left} to go - none of this session's kills have counted yet</div>`;
  const kills = Math.ceil(left / rate), mins = Math.round(kills * 60 / kph);
  const when = mins >= 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${Math.max(1, mins)} min`;
  return `<div class="hint" style="margin-top:2px">At this pace: about ${when} to go (about ${kills} more kills)</div>`;
}

function trialBox(p, mobNames, run) {
  const x = (p.config || {}).extra || {}, list = arr(x.trials), wl = arr(p.ws_list);
  const f = trialForm;
  const o = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur) ? "selected" : ""}>${esc(l)}</option>`;
  return `<div class="box"><h3>Magian trials</h3>
    ${list.length ? list.map(t => `<div style="margin-bottom:8px">
        <div class="row" style="justify-content:space-between;align-items:center">
          <span><b>${t.kind === "ws" ? `Defeat ${t.goal} ${esc(t.mobs || "enemies")} with ${esc(t.ws)}` : `Defeat ${t.goal} ${esc(t.mobs || "enemies")}`}</b>
            ${t.done ? `<span class="pill on">done</span>` : t.assist ? `<span class="pill on">helping</span>` : ""}</span>
          <span><b>${t.count}</b> / ${t.goal}
            <button style="font-size:11px" class="${t.assist ? "primary" : ""}" ${t.done ? "disabled" : ""} onclick="send('trial assist ${t.k}')">${t.assist ? "Helping ✓" : "Help finish it"}</button>
            <button style="font-size:11px" title="Start the count again" onclick="send('trial reset ${t.k}')">↺</button>
            <button style="font-size:11px" title="Remove" onclick="send('trial del ${t.k}')">×</button></span></div>
        <div class="hpbar" style="height:8px"><div style="background:var(--good);width:${t.goal ? Math.min(100, t.count * 100 / t.goal) : 0}%"></div></div>
        ${t.tries ? `<div class="hint" style="margin-top:3px">This session ${esc(t.ws)} landed the kill on ${t.hits || 0} of ${t.tries} (${Math.round((t.hits || 0) * 100 / t.tries)}%)</div>` : ""}
        ${trialMisses(t)}
        ${trialEta(t, run)}
        ${t.kind === "ws" && !t.done ? `<div class="row" style="margin-top:4px;align-items:center">
          <label class="field">Use ${esc(t.ws)} when the mob's HP is at ${sel("set ws.finish_at ", [{v: 0, l: "Auto (learned" + (learnedAt(x, t.mobs) ? ": " + learnedAt(x, t.mobs) + "%" : "") + ")"}].concat([3, 5, 8, 10, 12, 15, 18, 20, 25, 30, 35, 40, 50].map(v => ({v, l: "or under " + v + "%"}))), x.ws_finish_at ?? 0)}</label>
          ${x.ws_finish !== t.ws ? `<span class="hint">(applies when "Help finish it" is on)</span>` : ""}</div>` : ""}</div>`).join("")
      : `<div class="hint">No trials yet. Add one below - Vanguard counts the kills that fit it.</div>`}
    <div class="row" style="margin-top:8px;align-items:flex-end;flex-wrap:wrap">
      <label class="field">Trial <select onchange="trialForm.kind=this.value;bodyKey='';render()">${o("kill", "Defeat enemies", f.kind)}${o("ws", "Defeat enemies with a weapon skill", f.kind)}</select></label>
      ${f.kind === "ws" ? `<label class="field">Weapon skill <select onchange="trialForm.ws=this.value;bodyKey='';render()"><option value="">- pick -</option>${wl.map(w => o(w, w, f.ws)).join("")}</select></label>` : ""}
      <label class="field">Which <select onchange="trialForm.mobs=this.value"><option value="">any enemy</option>${mobNames.map(n => o(n, n, f.mobs)).join("")}</select></label>
      <label class="field">How many <select onchange="trialForm.goal=+this.value">${[10, 20, 30, 50, 75, 100, 150, 200, 250, 300, 500, 1000].map(v => o(v, v, f.goal)).join("")}</select></label>
      <button class="primary" onclick="trialAdd()" ${f.kind === "ws" && !f.ws ? "disabled" : ""}>Add trial</button>
    </div>
    ${x.trial_game ? `<div class="hint" style="margin-top:6px">The game said: "${esc(x.trial_game)}"</div>` : ""}
    <div class="hint" style="margin-top:4px">A weapon skill trial counts a kill only when that weapon skill lands the killing blow. "Help finish it" farms the trial's
      mobs, finishes them with its weapon skill (TP saved, the others leave the mob) and stops farming when the count is reached. Wear the trial weapon yourself.</div>
  </div>`;
}

function farmTab(c, p) {
  const s = c.snapshot || {}, x = (p.config || {}).extra || {}, mods = (p.config || {}).modules || s.modules || {};
  const known = (p.config || {}).known || {};
  const tgt = String(x.farm_targets || "").split(",").map(t => t.trim()).filter(Boolean);
  const ign = String(x.farm_ignore || "").split(",").map(t => t.trim()).filter(Boolean);
  const nb = c.nearby, mobs = arr(nb && nb.mobs);
  const on = (n, list) => list.some(t => lc(t) === lc(n));
  const mode = x.farm_mode || "list", area = x.farm_area || "camp";
  const ready = mode !== "list" || tgt.length > 0;
  const farming = !!mods.farm && s.enabled;
  const paused = !!mods.farm && !s.enabled && ((s.farm || {}).run || {}).paused;
  const f = s.farm || {}, run = f.run || {}, st = s.stats || {};
  const nums = (list, unit) => list.map(v => ({v, l: v + unit}));
  const segBtns = (cur, opts) => `<div class="seg">${opts.map(o => `<button class="${o.v === cur ? "on" : ""}" onclick="send('${o.cmd}')">${o.l}</button>`).join("")}</div>`;
  const chip = (n, list) => `<span class="btag" style="font-size:12px">${esc(n)} <a href="#" style="color:var(--bad);text-decoration:none" title="Remove"
      onclick="send('farmlist remove ${list} ${esc(n)}');return false">×</a></span>`;
  const card = (n, title, body) => `<div class="box"><h3><span class="pill on" style="margin-right:6px">${n}</span>${title}</h3>${body}</div>`;
  const mins = v => { const m = Math.floor((v || 0) / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m ${(v || 0) % 60}s`; };
  const perHourXp = st.secs >= 300 ? fmtN(Math.round((st.exp || 0) * 3600 / st.secs)) : "—";
  // pulls this character can do
  const PULLERS = ["Provoke", "Flash", "Dia", "Dia II", "Bio", "Stone", "Animated Flourish", "Jump", "Sleep", "Foe Lullaby", "Light Shot"];
  const ab = arr(known.abilities), sp = arr(known.spells);
  const pullOpts = [{v: "none", l: "Walk up and attack"}, {v: "ra", l: "Ranged attack"}]
    .concat(PULLERS.filter(n => ab.includes(n)).map(n => ({v: "ja " + n, l: n})))
    .concat(PULLERS.filter(n => sp.includes(n)).map(n => ({v: "ma " + n, l: n})));
  const pc = String(x.farm_pull || ""), pm = pc.match(/^input \/(ja|ma) "(.+)" <t>$/);
  const pullCur = !pc ? "none" : pc === "input /ra <t>" ? "ra" : pm ? pm[1] + " " + pm[2] : "custom";
  if (pm && !pullOpts.some(o => o.v === pullCur)) pullOpts.push({v: pullCur, l: pm[2]});
  if (pullCur === "custom") pullOpts.push({v: "custom", l: pc});
  const route = f.rec != null ? f.rec : (x.farm_route || 0);
  const spots = arr(x.farm_spots), here = spots.filter(q => q.here), elsewhere = spots.filter(q => !q.here);
  const others = Object.keys(chars).filter(n => n !== selected && chars[n].online);
  const following = others.filter(n => lc((chars[n].snapshot || {}).leader) === lc(selected));
  const statusText = paused ? "Paused - the run carries on when you resume" : farming ? cap(f.status || "starting") : f.status && f.status.startsWith("stopped: ") ? cap(f.status) : ready ? "Ready" : "Pick what to fight";
  const statusCol = !farming ? "var(--muted)" : /^(waiting|at camp)/.test(f.status || "") ? "var(--tp)" : /^(fighting|going|bringing|walking)/.test(f.status || "") ? "var(--good)" : "var(--text)";

  const all = farmView === "all";
  return `<div class="stack">
    <div class="row" style="justify-content:flex-end;align-items:center;gap:8px"><span class="hint">Show</span>
      <div class="seg"><button class="${all ? "" : "on"}" onclick="setFarmView('simple')">Simple</button><button class="${all ? "on" : ""}" onclick="setFarmView('all')">All settings</button></div></div>
    <div class="box" style="border-color:${farming ? "var(--good)" : "var(--line)"}">
      <div class="fdash">
        <div>
          <div class="row" style="align-items:center;gap:14px">
            ${paused ? `<button class="go" style="font-size:16px;padding:10px 22px" onclick="send('farming resume')">▶ Resume</button>
                 <button class="stop" onclick="send('farming stop')">■ Stop (end the run)</button>`
              : farming ? `<button class="stop" style="font-size:16px;padding:10px 22px" onclick="send('farming stop')">■ Stop farming</button>
                 <button title="Stop for a moment without ending the run (paused time isn't counted)" onclick="send('farming pause')">❚❚ Pause</button>`
              : `<button class="go" style="font-size:16px;padding:10px 22px" ${ready ? "" : "disabled title='Pick what to fight first'"} onclick="send('farming start')">▶ Start farming</button>
                 <button title="Farms the most common unclaimed mob within 30 yalms, with the camp where you stand" onclick="send('farming quick')">⚡ Quick start: farm what's here</button>`}
            <div><div class="fstatus" style="color:${statusCol}">${esc(statusText)}</div>
              <div class="hint">${esc(selected)} ${farming ? `· ${mode === "list" ? esc(tgt.join(", ")) : mode === "aggro" ? "only what attacks us" : "anything nearby"}` : paused ? "· click Resume" : ready ? "· click Start farming" : "· step 1 below"}</div></div>
          </div>
          <div class="row" style="margin-top:6px;align-items:center"><span class="hint">Start / stop from the game with</span>
            ${sel("farmkey ", [{v: "off", l: "no key"}, {v: "^f8", l: "Ctrl+F8"}, {v: "^f9", l: "Ctrl+F9"}, {v: "^f10", l: "Ctrl+F10"}, {v: "!f9", l: "Alt+F9"}], x.farm_hotkey || "off")}</div>
          <div class="tiles">
            <div class="tile"><b>${run.secs ? mins(run.secs) : "—"}</b><span>this run</span></div>
            <div class="tile"><b>${run.kills ?? "—"}</b><span>kills</span></div>
            <div class="tile"><b>${run.kph ?? "—"}</b><span>kills / hour</span></div>
            <div class="tile"><b>${run.every ? run.every + "s" : "—"}</b><span>a kill every</span></div>
            <div class="tile"><b>${perHourXp}</b><span>XP / hour (session)</span></div>
            <div class="tile"><b>${st.secs >= 300 ? fmtN(Math.round((st.cp || 0) * 3600 / st.secs)) : "—"}</b><span>CP / hour (session)</span></div>
            <div class="tile"><b>${run.skipped ?? "—"}</b><span>mobs skipped</span></div>
            <div class="tile"><b style="color:${(run.free ?? x.inv_free) === 0 ? "var(--bad)" : "var(--text)"}">${run.free ?? x.inv_free ?? "—"}</b><span>bag spaces free</span></div>
          </div>
          ${arr(run.spark).some(v => v > 0) ? (() => { const mx = Math.max(...run.spark, 1);
            return `<div style="margin-top:10px"><div class="hint" style="font-size:11px">Kills per 5 minutes (last hour)</div>
              <svg width="100%" height="34" viewBox="0 0 240 34" preserveAspectRatio="none">${run.spark.map((v, i) => `<rect x="${i * 20 + 2}" y="${32 - v * 30 / mx}" width="16" height="${v * 30 / mx}" rx="2" fill="${i === 11 ? "#4caf7a" : "#3b7d5c"}"><title>${v} kill${v === 1 ? "" : "s"}</title></rect>`).join("")}</svg></div>`; })() : ""}
          ${run.chain ? `<div class="row" style="margin-top:10px;align-items:center;gap:10px">
              <span class="pill ${run.chain.n >= 1 ? "on" : "off"}" style="font-size:13px">${run.chain.n >= 1 ? `Chain #${run.chain.n}` : "No chain"}</span>
              <span class="hint">${run.chain.since}s since the last kill · best #${run.chain.best}${run.chain.min || run.chain.max ? ` · chain window ${run.chain.min ? `at least ${run.chain.min}s` : ""}${run.chain.min && run.chain.max ? ", " : ""}${run.chain.max ? `under ${run.chain.max}s` : ""}` : ""}</span></div>` : ""}
          ${run.item ? `<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><b style="font-size:12px">Farming for ${esc(run.item.n)}</b>
              <span><b>${run.item.have}</b> / ${run.item.goal || "?"} in the bags</span></div>
              <div class="hpbar" style="height:8px"><div style="background:var(--good);width:${run.item.goal ? Math.min(100, run.item.have * 100 / run.item.goal) : 0}%"></div></div></div>` : ""}

        <label class="field">After ${sel("set farm.stop_kills ", [{v: 0, l: "no limit"}].concat(nums([10, 25, 50, 100, 200, 500], " kills")), x.farm_stop_kills ?? 0)}</label>
        <label class="field">or after ${sel("set farm.stop_mins ", [{v: 0, l: "no time limit"}].concat([15, 30, 45, 60, 90, 120, 180, 240].map(v => ({v, l: v >= 60 ? (v / 60) + " hour" + (v > 60 ? "s" : "") : v + " minutes"}))), x.farm_stop_mins ?? 0)}</label>
        <label class="field">or when ${c.name || "this character"} reaches ${sel("set farm.stop_level ", [{v: 0, l: "any level (keep going)"}].concat(Array.from({length: 99 - Math.min(98, x.my_level || 1)}, (_, i) => Math.min(98, x.my_level || 1) + 1 + i).map(v => ({v, l: "level " + v}))).concat(x.farm_stop_level && !(x.farm_stop_level > (x.my_level || 1)) ? [{v: x.farm_stop_level, l: "level " + x.farm_stop_level}] : []), x.farm_stop_level ?? 0)}</label>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="field">When done ${sel("set farm.when_done ", [{v: "stay", l: "stay where they are"}, {v: "warp", l: "everyone warps home"}, {v: "logout", l: "everyone logs out"}], x.farm_when_done || "stay")}</label>
      </div>
      <div class="row" style="margin-top:8px;align-items:flex-end">
        <label class="field">Farm for ${sel("farmitem ", [{v: "none", l: "nothing in particular"}].concat(
            Array.from(new Set(arr(x.inv_items).concat(arr(run.loot).map(l => l.n), x.farm_item ? [x.farm_item] : []))).sort().map(n => ({v: n, l: n}))), x.farm_item || "none")}</label>
        ${x.farm_item ? `<label class="field">until I have ${sel("set farm.item_goal ", [1, 3, 5, 10, 12, 20, 30, 50, 99, 100, 200, 500].map(v => ({v, l: v + ""})), x.farm_item_goal || 12)}</label>` : ""}
      </div>
      <div class="hint" style="margin-top:4px">Pick something you already have or that dropped this run; it stops when that many are in the inventory.</div>
      ${(() => {
        const watch = String(x.farm_watch || "").split(",").map(t => t.trim()).filter(Boolean);
        const names = Array.from(new Set(arr(x.inv_items).concat(arr(run.loot).map(l => l.n)))).filter(n => !watch.includes(n)).sort();
        return `<div class="row" style="margin-top:8px;align-items:center;flex-wrap:wrap"><span class="hint">Ring when one of these drops:</span>
          ${watch.map(n => `<span class="btag" style="font-size:12px">🔔 ${esc(n)} <a href="#" style="color:var(--bad);text-decoration:none" title="Remove" onclick="send('farmwatch remove ${esc(n)}');return false">×</a></span>`).join("") || `<span class="hint">nothing</span>`}
          ${sel("farmwatch add ", [{v: "", l: "+ add an item..."}].concat(names.map(n => ({v: n, l: n}))), "")}</div>`;
      })()}
      <div class="hint" style="margin-top:6px">It also stops if ${esc(selected)} is KO'd or changes zone. The Alarms ring when farming stops.</div>`)}

    ${!all ? "" : card(6, "Trusts (optional)", (() => {
      const picked = String(x.trusts_list || "").split(",").map(t => t.trim()).filter(Boolean);
      const avail = arr(known.trusts).filter(t => !picked.some(q => lc(q) === lc(t))).sort();
      return `<div class="row" style="align-items:flex-start;gap:18px">
          <div><b style="font-size:12px;color:var(--accent)">Call these</b><div>${picked.length ? picked.map(n => `<span class="btag" style="font-size:12px"><span class="hint">${trustRole(n)}:</span> ${esc(n)}
            <a href="#" style="color:var(--bad);text-decoration:none" title="Remove" onclick="send('trustlist remove ${esc(n)}');return false">×</a></span>`).join("")
            : `<span class="hint">none</span>`}</div></div>
          <label class="field">until the party has ${sel("set trusts.party_size ", nums([2, 3, 4, 5, 6], " members"), x.trusts_size ?? 5)}</label>
        </div>
        ${avail.length ? `<div class="row" style="margin-top:8px">${trustSelect(avail)}</div>`
          : `<div class="hint" style="margin-top:6px">${arr(known.trusts).length ? "All its trusts are picked." : "No trusts known by this character."}</div>`}`;
    })())}
    </div>

    <div class="box"><h3>Past runs</h3>
      ${farmRuns.length ? `<table class="grid"><thead><tr><th style="text-align:left">When</th><th>Who</th><th style="text-align:left">Where</th><th>Time</th><th>Kills</th><th>Kills / hour</th><th>XP</th><th>CP</th><th style="text-align:left">Loot</th><th style="text-align:left">Why it stopped</th></tr></thead><tbody>
        ${farmRuns.slice().reverse().slice(0, 15).map(r => `<tr><td style="text-align:left">${esc(r.time)}</td><td>${esc(r.who)}</td><td style="text-align:left">${esc(r.zone)}<div class="hint">${esc(r.mobs)}</div></td>
          <td>${mins(r.secs)}</td><td>${r.kills}</td><td>${r.secs >= 120 ? Math.round(r.kills * 3600 / r.secs) : "—"}</td><td>${fmtN(r.xp)}</td><td>${fmtN(r.cp)}</td>
          <td style="text-align:left" class="hint">${esc(r.loot || "—")}</td><td style="text-align:left" class="hint">${esc(r.why)}</td></tr>`).join("")}
      </tbody></table>
      <div class="row" style="margin-top:6px"><button style="font-size:11px" onclick="farmRunsDo('do=clear')">Clear the history</button></div>`
      : `<div class="hint">Each farming run is kept here when it ends: how long, kills, XP / CP, loot and why it stopped.</div>`}
    </div>
  </div>`;
}

function advTab(p) {
  const mods = (p.config || {}).modules || (chars[selected].snapshot || {}).modules || {};
  return `<div class="stack">
    <div class="box"><h3>All modules</h3><div class="mods">${MODULES.map(m => modChk(m, mods, m)).join("")}</div></div>
    ${reactBox(p)}
    <div class="box"><h3>Farming</h3><div class="row"><span class="hint">Farming has its own tab now.</span>
      <button onclick="setTab('farm')">Open Farming</button></div></div>
    <div class="box"><h3>Command</h3><div class="row">
      <select id="cmdtarget"><option value="sel">${esc(selected)}</option><option value="*">All characters</option></select>
      <input type="text" id="cmd" placeholder="Same as //vg … e.g. trigger add hpp<35 -> input /ja &quot;Sentinel&quot; <me> | 60" onkeydown="if(event.key==='Enter')sendCmd()">
      <button onclick="sendCmd()">Send</button>
      <button onclick="fetch('/api/open-settings')">Open settings folder</button>
    </div></div>
  </div>`;
}
function sendCmd() {
  const c = $("cmd").value.trim(); if (!c) return;
  post($("cmdtarget").value === "*" ? "*" : selected, c); $("cmd").value = "";
}

// ---------- events (one listener for every control) ----------
document.addEventListener("change", e => {
  const el = e.target;
  if (el.tagName === "SELECT") el.blur();   // picked: let the page redraw again
  if (el.id === "autostart") { post("*", `set autostart ${el.checked ? "true" : "false"}`); return; }
  if (el.id === "profauto") {
    const job = (chars[selected].profile || {}).job;
    profDo(`do=auto&char=${encodeURIComponent(selected)}&job=${job}&name=${el.checked ? encodeURIComponent(profPick()) : ""}`);
    return;
  }
  if (el.id === "profsel") return;
  if (["tmmode", "tmmins", "tmhour", "tmminute", "tmaction", "tmwho"].includes(el.id)) { tm[el.id.slice(2)] = el.value; bodyKey = ""; render(); return; }
  if (el.id === "hkhost") { hkHost = el.value; return; }
  if (el.dataset.scwho !== undefined) { scb[+el.dataset.scwho].who = el.value; scb[+el.dataset.scwho].ws = ""; bodyKey = ""; render(); return; }
  if (el.dataset.scws !== undefined) { scb[+el.dataset.scws].ws = el.value; bodyKey = ""; render(); return; }
  if (el.dataset.up !== undefined) {
    const who = el.dataset.who, v = el.value, kind = el.dataset.up;
    post(who, kind === "mount" ? `set mount.name ${v}` : `${kind} ${v}`);
    return;
  }
  if (["rxwhen", "rxval", "rxwho", "rxkind", "rxname", "rxtarget", "rxcd"].includes(el.id)) {
    rx[el.id.slice(2)] = el.value; if (el.id === "rxwhen") rx.val = ""; if (el.id === "rxkind") rx.name = "";
    bodyKey = ""; render(); return;
  }
  if (el.id === "rxfight") { rx.fight = el.checked; return; }
  if (el.dataset.hk !== undefined) { quickDo(`do=key&i=${el.dataset.hk}&key=${encodeURIComponent(el.value)}&host=${encodeURIComponent(hkHost || leaderName() || selected)}`); return; }
  if (["qbwho", "qbkind", "qbname", "qbtarget"].includes(el.id)) {
    qb[el.id.slice(2)] = el.value; if (el.id !== "qbname" && el.id !== "qbtarget") qb.name = "";
    bodyKey = ""; render(); return;
  }
  if (el.id === "pianadd") { if (el.value) { pianAdded.add(el.value); bodyKey = ""; render(); } return; }
  if (el.dataset.tiers !== undefined) { send("set heal.tiers " + tierString()); return; }
  if (el.id === "entSpell" || el.id === "entWho") {
    const sp = $("entSpell").value, who = $("entWho").value;
    send(sp && who ? `menu entrust ${who} ${sp}` : "menu entrust none");
    return;
  }
  if (el.dataset.on !== undefined) { send(el.checked ? el.dataset.on : el.dataset.off); el.closest(".chk")?.classList.toggle("off", !el.checked); return; }
  if (el.dataset.cmd !== undefined) { send(el.dataset.cmd + (el.value || el.dataset.empty || "")); el.blur(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.type === "range") el.parentElement.querySelector("output").textContent = el.value + (el.dataset.unit || "");
});
document.addEventListener("click", e => { const card = e.target.closest(".card"); if (card) selectChar(card.dataset.name); });

// ---------- render ----------
function renderList() {
  const names = Object.keys(chars).sort();
  if (!names.length) return;
  const key = JSON.stringify(names.map(n => [n, chars[n].online, chars[n].snapshot, (chars[n].profile || {}).role])) + selected + (addon.installed || "") + JSON.stringify(arr(alarmState.active).map(a => a.who));
  if (key === listKey) return;
  listKey = key;
  $("chars").innerHTML = names.map(n => {
    const c = chars[n], s = c.snapshot || {}, p = c.profile || {};
    const role = arr(p.roles).find(r => r.id === p.role);
    const sub = [role ? role.label : "", c.online ? (s.status || "") : "offline", s.target ? `${s.target} ${s.target_hpp}%` : ""].filter(Boolean).join(" · ");
    return `<div class="card ${n === selected ? "sel" : ""} ${c.online ? "" : "offline"} ${arr(alarmState.active).some(a => a.who === n) ? "alarm" : ""}" data-name="${esc(n)}">
      <div class="top"><span class="nm">${esc(n)}</span><span class="jb">${esc(s.job || p.job || "")}${p.sub && !String(s.job || "").includes("/") ? "/" + esc(p.sub) : ""}</span>
        ${addon.installed && c.online && (!s.version || s.version !== addon.installed) ? `<span class="pill warn" title="Runs Vanguard ${esc(s.version || "from before 0.13")}; ${esc(addon.installed)} is installed">OLD</span>` : ""}
        <span class="pill ${s.enabled ? "on" : "off"}">${s.enabled ? "ON" : "OFF"}</span></div>
      <div class="sub">${esc(sub)}</div>
      <div class="bars">${bar(s.hpp, "var(--hp)", 100, "HP")}${bar(s.mpp, "var(--mp)", 100, "MP")}${bar(s.tp, "var(--tp)", 3000, "TP")}</div>
      ${c.online && arr(s.buffs).some(b => b.b) ? `<div class="ail">${arr(s.buffs).filter(b => b.b).map(b => `<span class="btag bad">${esc(b.n)}</span>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
}

function renderPanel() {
  const c = chars[selected];
  if (!c) { $("panel").innerHTML = ""; return; }
  const s = c.snapshot || {}, p = c.profile || {};
  const tabs = tabsFor(p);
  if (!tabs.find(t => t.id === tab)) tab = "team";

  const hk = JSON.stringify([selected, s.enabled, p.job, p.sub, tab, tabs]);
  if (hk !== headKey || !$("tabbody")) {
    headKey = hk; bodyKey = ""; profKey = "";
    $("panel").innerHTML = `
      <div class="who" style="margin-bottom:10px"><span class="nm">${esc(selected)}</span>
        <span class="jb">${esc(p.job || s.job || "")}${p.sub ? " / " + esc(p.sub) : ""} · ${s.enabled ? "running" : "stopped"}</span><span class="sp"></span>
        <button class="${s.enabled ? "stop" : "go"}" onclick="send('${s.enabled ? "off" : "on"}')">${s.enabled ? "Stop" : "Start"}</button>
        <button onclick="send('reset')" title="Back to the recommended setup for this job; clears your ticks for this job">Reset to recommended</button></div>
      <div class="profbar" id="profbar"></div>
      <div class="tabs">${tabs.map(t => `<div class="tab ${t.id === tab ? "on" : ""}" onclick="setTab('${t.id}')">${t.label}${t.n ? `<span class="n">${t.n}</span>` : ""}</div>`).join("")}</div>
      <div class="body" id="tabbody"></div>`;
  }
  renderProfBar(p);
  // Don't redraw under the user's hand while a slider, number or text box is in use.
  const a = document.activeElement;
  // (a drop-down menu too: redrawing while it's open closed it before you could pick anything)
  if (a && $("tabbody").contains(a) && (a.type === "range" || a.type === "text" || a.type === "number" || a.tagName === "SELECT")) return;
  const team = tab === "team" ? Object.keys(chars).map(n => [n, (chars[n].snapshot || {}).hold, (chars[n].snapshot || {}).camp,
    (chars[n].snapshot || {}).retreat, (chars[n].snapshot || {}).defense, (chars[n].snapshot || {}).leader,
    (chars[n].snapshot || {}).stats, chars[n].online, (chars[n].snapshot || {}).buffs, (chars[n].snapshot || {}).hpp,
    (chars[n].snapshot || {}).mpp, (chars[n].snapshot || {}).tp, (chars[n].snapshot || {}).status, (chars[n].snapshot || {}).target,
    (chars[n].snapshot || {}).foe]) : 0;
  const bk = JSON.stringify([tab, p, s.leader, Object.keys(chars), team, tab === "app" ? [addon, crashes] : 0, tab === "strat" ? s.strat : 0, tab === "adv" || tab === "farm" ? c.nearby : 0,
    tab === "farm" ? [farmRuns.length, s.farm, s.enabled, s.stats, s.modules, s.status, Object.keys(chars).map(n => { const q = chars[n].snapshot || {}; return [q.leader, chars[n].online, q.hpp, q.mpp, q.status, q.target, q.target_hpp]; })] : 0,
    tab === "team" ? [warpArm, Object.keys(chars).map(n => ((((chars[n].profile || {}).config || {}).known) || {}).warp), stopTimer.until, Math.floor((stopTimer.left || 0) / 60)] : 0]);
  if (bk === bodyKey) return;
  bodyKey = bk;
  const fn = {job: () => jobTab(c, p), heal: () => healTab(p), buffs: () => buffsTab(p), debuffs: () => debuffsTab(p),
              songs: () => songsTab(p), geo: () => geoTab(p), adv: () => advTab(p), team: () => teamTab(c, p),
              app: () => appTab(), strat: () => stratTab(c, p), news: () => newsTab(), farm: () => farmTab(c, p)}[tab];
  $("tabbody").innerHTML = fn();
}

function render() {
  const names = Object.keys(chars).sort();
  if (names.length && !selected) selected = names[0];
  renderList();
  renderPanel();
  renderCooldowns();
  const online = names.filter(n => chars[n].online).length;
  const as = $("autostart"), on = names.filter(n => chars[n].online);
  if (as && document.activeElement !== as) {
    as.checked = on.length > 0 && on.every(n => (chars[n].snapshot || {}).autostart === true);
    $("autostartbox").classList.toggle("off", !as.checked);
  }
  $("status").textContent = names.length ? `${online} of ${names.length} character(s) online` : "Waiting for characters…";
}

let pageVersion = "";
async function poll() {
  try {
    const d = await (await fetch("/api/state?since=" + since)).json();
    // the app updated itself and restarted behind this window: load the new page
    if (d.version) { if (pageVersion && d.version !== pageVersion) { location.reload(); return; } pageVersion = d.version; }
    chars = d.chars || {};
    const log = $("log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    for (const l of d.logs) {
      const div = document.createElement("div");
      div.innerHTML = `<span>${l.time}</span>${esc(l.text)}`;
      log.appendChild(div); since = l.id;
    }
    while (log.children.length > 400) log.removeChild(log.firstChild);
    if (atBottom) log.scrollTop = log.scrollHeight;
    render();
  } catch (e) {
    $("status").textContent = "Vanguard Control stopped. Close this window.";
  }
  setTimeout(poll, 600);
}
poll();
pollAddon();
quickDo("");
timerDo("");
crashDo("");
alarmDo("");
if (tab === "farm") setTimeout(radarPoll, 1500);
profDo("");
</script>
</body>
</html>
